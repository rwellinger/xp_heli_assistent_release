# xp_heli_assistent tuning
# aircraft: Guimbal Cabri G2
#
# NO GAIN HERE HAS BEEN FLOWN. Every one is carried over from the R22 as a starting
# point. Fly F2 to F6 from the tuning table in docs/open-items.md, one axis at a time, with the
# abort criteria. The airframe's measured constants are a separate matter and live in the
# profile - see below.

# ── What is NOT set here, on purpose ─────────────────────────────────────────
# The measured aircraft constants live in profiles/Guimbal_Cabri_G2.profile, and all
# three of this airframe's are measured now:
#
#   collective.hover_collective  0.659   settled hover, median of the collective
#   yaw.torque_per_collective    3.781   collective sweep, r = +0.995
#   yaw.hover_pedal             +0.637   the pedal standing at that hover
#
# They are NOT repeated here and must not be. A measured airframe constant that sits in
# this file is no longer recognisable as measured - it stands among dozens of gains
# somebody nudged by feel, and a year later nobody knows which of them has a flight
# behind it.
#
# The last two are a pair. The slope is anchored at the hover pedal, and on this airframe
# that is not a refinement: anchored at collective zero instead, the same slope asks for
# 2.49 of pedal against a full travel of 1.0, which is what pinned the right stop on
# 2026-08-22. A test refuses any profile that names one without the other.
#
# THE SIGN FOLLOWS THE ROTOR, and getting it wrong makes the feedforward drive the yaw it
# exists to cancel. This one turns like the EC130 and hovers on right pedal.

# ── Yaw damper ───────────────────────────────────────────────────────────────
# A fenestron behaves differently from an open tail rotor - expect its own tuning.
yaw.kp                       = 0.0800
yaw.ki                       = 0.0200
yaw.kd                       = 0.0400
yaw.authority                = 1.0000
yaw.integral_limit           = 1.0000
yaw.command_rate_deg_s       = 30.0000
yaw.deadband                 = 0.0500
yaw.max_error_deg            = 30.0000
yaw.coord_kp                 = 0.0200
yaw.coord_ki                 = 0.0040
yaw.max_sideslip_deg         = 20.0000

# ── Collective altitude hold ─────────────────────────────────────────────────
collective.kp                = 0.0600
collective.ki                = 0.0200
collective.kd                = 0.0100
collective.altitude_gain     = 0.5000
# collective.max_climb_ms is not set: this airframe's rotor droops past the knee above about
# 2 m/s, so the bound is measured and lives in the profile.
collective.max_offset        = 0.3500

# ── Cyclic assist ────────────────────────────────────────────────────────────
# Three-blade rotor with much more inertia than the R22's teetering head - it should
# tolerate more gain, but that has to be flown, not assumed.
cyclic.outer_kp              = 2.0000
cyclic.outer_ki              = 0.2670
# cyclic.inner_kp is measured for this airframe and lives in its profile (0.1000 —
# the roll axis rings at 0.130). Setting it here would silently win over the measurement.
# cyclic.inner_kd is not set: it belongs to the profile once flown. A 0.0000 here undid the
# profile's 0.040 on the AS350, the 902X and the B412.
# Raised from 3.0 on 2026-08-24: at 3.0 the R22 and EC130 integrators sat at the
# stop for the whole climb and left 0.42 m/s of residual drift, which is 21 m over
# a sequence. The R22's measured hover roll alone is -3.52 deg.
cyclic.integral_limit_deg    = 5.0000
cyclic.command_rate_deg_s    = 3.0000
cyclic.authority             = 0.3000

# ── Take-off ─────────────────────────────────────────────────────────────────
# The assistant's lift-off ramp (Full) and the height at which the
# collective assist engages. The settle thresholds say when the hover learner
# counts a hover as settled.
sequence.low_hover_m         = 3.0000
sequence.lift_seconds        = 4.0000
sequence.lift_timeout_s      = 30.0000
sequence.settle_climb_ms     = 0.3000
sequence.settle_drift_ms     = 0.5000
sequence.settle_yaw_deg_s    = 3.0000
sequence.rotor_droop_grace_s = 1.0000
