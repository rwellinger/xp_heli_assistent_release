# xp_heli_assistent tuning
# aircraft: VSKYLABS Hungarocopter HC-02
#
# NOTHING HERE HAS BEEN FLOWN. Every gain is the generic starting value. Fly the sweep
# and the per-axis flights from docs/adding-an-aircraft.md before trusting any of it.
#
# Probed 2026-10-11 against a running sim, on the skids with the rotor governed at
# 540 RPM: all required datarefs read through the standard paths, no add-on script holds
# an override flag. The collective is written as a blade angle on index 0, not through
# prop_ratio_all — the electric ERS is engine 1, see the profile. A piston with a real
# manifold. 600 kg MTOW, blade pitch 0 .. +12.5 degrees.
#
# ── What is NOT set here, on purpose ─────────────────────────────────────────
# Measured aircraft constants live in profiles/VSKYLABS_Hungarocopter_HC_02.profile so
# that they reach every user rather than only this machine. As of today there are none
# beyond the .acf figures: the aircraft has not been flown with the plugin, and a profile
# does not invent values.
#
# Procedure: docs/adding-an-aircraft.md

# ── Yaw damper ───────────────────────────────────────────────────────────────
# A conventional tail rotor, anticlockwise main rotor like the R22. Untested here; these
# are the R22's numbers. The pedal reaches the tail rotor scaled by 1.25 (see the profile),
# so the same gain acts a quarter harder than on the R22.
yaw.kp                       = 0.0800
yaw.ki                       = 0.0200
yaw.kd                       = 0.0400
yaw.authority                = 1.0000
yaw.integral_limit           = 1.0000
yaw.command_rate_deg_s       = 30.0000
yaw.deadband                 = 0.0500
yaw.max_error_deg            = 30.0000
yaw.coord_kp                 = 0.0200
yaw.coord_ki                 = 0.0040
yaw.max_sideslip_deg         = 20.0000

# ── Collective altitude hold ─────────────────────────────────────────────────
collective.kp                = 0.0600
collective.ki                = 0.0200
collective.kd                = 0.0100
collective.altitude_gain     = 0.5000
# collective.max_climb_ms is not set: the profile measures it (power runs out above 3.5 m/s).
collective.max_offset        = 0.3500

# ── Cyclic assist ────────────────────────────────────────────────────────────
# X-Plane's artificial stability is live on this airframe (rates 0.005 on all three
# axes) — a second loop under this one, though a weak one.
cyclic.outer_kp              = 2.0000
cyclic.outer_ki              = 0.2670
# cyclic.inner_kp, cyclic.inner_kd, cyclic.attitude_limit_deg and cyclic.integral_limit_deg
# are not set: they get swept or flown and then belong to the profile. A value here would
# silently win over a later measurement there.
cyclic.command_rate_deg_s    = 3.0000
cyclic.authority             = 0.3000

# ── Take-off ─────────────────────────────────────────────────────────────────
# The assistant's lift-off ramp (Full) and the height at which the
# collective assist engages. The settle thresholds say when the hover learner
# counts a hover as settled.
sequence.low_hover_m         = 3.0000
sequence.lift_seconds        = 4.0000
sequence.lift_timeout_s      = 30.0000
sequence.settle_climb_ms     = 0.3000
sequence.settle_drift_ms     = 0.5000
sequence.settle_yaw_deg_s    = 3.0000
sequence.rotor_droop_grace_s = 1.0000
