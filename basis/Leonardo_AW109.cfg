# xp_heli_assistent tuning
# aircraft: Leonardo AW109 (X-Trident)
#
# NOTHING HERE IS MEASURED AND NOTHING HAS BEEN FLOWN. Feasibility passed on 2026-08-26
# and the aircraft is registered, which is all that is established.
#
# This add-on does not use X-Plane's standard axes. It runs its own namespace, whose
# prefix is literally "000/", and the profile carries the write path for all four axes.
# Verified: prop_ratio held at 0.50 for 30 s moved engine torque by 0.9 Nm, while
# 000/joy_collective_ratio at 0.45 moved it by 138 and made the aircraft light.
#
# What to measure, in this order — docs/adding-an-aircraft.md has the procedure:
#
#   1. cyclic.inner_kp. Absent below on purpose, so the generic 0.060 applies — a Robinson
#      R22 measurement at 539 kg against this aircraft's 2710 kg. Every airframe measured
#      since sits between 0.100 and 0.155. Too low is not harmless: it costs the position
#      hold its authority against wind. Sweep it before anything that depends on it.
#   2. collective.hover_collective, from a settled hover.
#   3. cyclic.hover_trim_long/lat. Absent means the loop relearns the lean on every
#      take-off, at roughly 3.3 m of drift per degree.
#   4. yaw.torque_per_collective, from a deliberate collective sweep. Its sign follows the
#      rotor's direction of turn — never carried over from another aircraft.
#
# Nothing was carried over from the AW139: different developer, less than half the mass.
# Only cyclic.integral_limit_deg and cyclic.attitude_limit_deg were, and those are bounds
# rather than tuning — too small means the assist cannot hold at all, too large only
# grants room it need not use.
#
# If this aircraft's own AP or SAS is on, switch it off before any measurement. Two
# controllers on one axis do not average, they fight, and neither log nor display says so.

# ── Yaw damper ───────────────────────────────────────────────────────────────
# R22 starting figures. yaw.torque_per_collective is absent and stays absent until it is
# measured on this airframe: its sign follows the rotor's direction of turn, and a wrong
# sign drives the yaw instead of cancelling it.
yaw.kp                       = 0.0800
yaw.ki                       = 0.0200
yaw.kd                       = 0.0400
yaw.authority                = 1.0000
yaw.integral_limit           = 1.0000
yaw.command_rate_deg_s       = 30.0000
yaw.deadband                 = 0.0500
yaw.max_error_deg            = 30.0000
yaw.coord_kp                 = 0.0200
yaw.coord_ki                 = 0.0040
yaw.max_sideslip_deg         = 20.0000

# ── Collective altitude hold ─────────────────────────────────────────────────
# collective.hover_collective is absent: unmeasured, and it sets the power the lift ramp
# commands off the ground. The AW139's 0.485 belongs to an airframe of more than twice
# the mass.
collective.kp                = 0.0600
collective.ki                = 0.0200
collective.kd                = 0.0100
collective.altitude_gain     = 0.5000
collective.max_climb_ms      = 5.0000
collective.max_offset        = 0.3500

# ── Cyclic assist ────────────────────────────────────────────────────────────
# Two keys deliberately absent, both owned by the profile:
#
#   cyclic.integral_limit_deg  8.0     generic 5.0, raised as on the AW139
#   cyclic.attitude_limit_deg  10.0    generic 6.0, raised as on the AW139
#
# Setting either here would silently win over the profile. They were raised because a
# bound that is too small means the assist cannot hold at all — an EC130 sat on the
# generic bound for every frame of a 159 s hover and slid 86 m with all three lamps lit.
# Too large only grants room the loop need not use. Whether this airframe actually needs
# them raised is unmeasured; the asymmetry is why they start there anyway.
#
# cyclic.hover_trim_long/lat are absent and must stay absent until measured. They are
# preloaded as attitude the moment the assist engages, so a value borrowed from a
# nose-up airframe is a lie handed to the student at the handover. Zero costs roughly
# 3.3 m of room per degree of trim and nothing else.
cyclic.outer_kp              = 2.0000
cyclic.outer_ki              = 0.2670
# cyclic.inner_kd is not set: it belongs to the profile once flown. A 0.0000 here undid the
# profile's 0.040 on the AS350, the 902X and the B412.
cyclic.command_rate_deg_s    = 3.0000
cyclic.authority             = 0.3000

# ── Take-off ─────────────────────────────────────────────────────────────────
# The assistant's lift-off ramp (Full) and the height at which the
# collective assist engages. The settle thresholds say when the hover learner
# counts a hover as settled.
sequence.low_hover_m         = 3.0000
sequence.lift_seconds        = 4.0000
sequence.lift_timeout_s      = 30.0000
sequence.settle_climb_ms     = 0.3000
sequence.settle_drift_ms     = 0.5000
sequence.settle_yaw_deg_s    = 3.0000
sequence.rotor_droop_grace_s = 1.0000
