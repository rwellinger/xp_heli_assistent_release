# xp_heli_assistent tuning
# aircraft: Airbus EC135
#
# Flown 2026-11-02 (laptop-thrustmaster), assistant Full: yaw.kd only. Everything else is
# the generic starting value; fly the sweep and the per-axis flights from
# docs/adding-an-aircraft.md before trusting it.
#
# Probed 2026-11-02 against a running sim, on the skids with the rotor governed at
# 387 RPM: all required datarefs read through the standard paths; cyclic and pedals
# written and their flags read back. The add-on (compiled plugin) holds the throttles
# (FADEC), override_prop_pitch and override_flightcontrol, and writes the main rotor's
# blade from the hardware lever every frame; in flight the plugin's collective write wins.
# Twin turbine, 6504 kg MTOW, blade pitch 0 .. 17.3 degrees — see the profile.
#
# ── What is NOT set here, on purpose ─────────────────────────────────────────
# Measured aircraft constants live in profiles/Airbus_EC135.profile so that
# they reach every user rather than only this machine.
#
# Procedure: docs/adding-an-aircraft.md

# ── Yaw damper ───────────────────────────────────────────────────────────────
# Fenestron, main rotor counter-clockwise like the R22 (prop_dir +1).
# kd 0.020, half the generic: the add-on delays the pedal by ~0.25 s (total_heading_ratio
# follows yoke_heading_ratio 7 frames late, corr 0.994, 2026-11-02 13:18) and mixes its own
# yaw damper into artstab_heading (0.67 x pedal - 0.012 x yaw rate). At 0.040 the heading
# hold rang at 1.05 s, +-6..8 deg/s, roll following; only in TAXI (coord_* is a quarter of
# kp and stayed calm above 18 kt). yaw.kp changed nothing, down to 0: at 1 Hz the loop is a
# rate loop. kd 0.020: still in the hover (13:24, yaw rate SD 0.03 deg/s) and flown Full.
yaw.kp                       = 0.0800
yaw.ki                       = 0.0200
yaw.kd                       = 0.0200
yaw.authority                = 1.0000
yaw.integral_limit           = 1.0000
yaw.command_rate_deg_s       = 30.0000
yaw.deadband                 = 0.0500
yaw.max_error_deg            = 30.0000
yaw.coord_kp                 = 0.0200
yaw.coord_ki                 = 0.0040
yaw.max_sideslip_deg         = 20.0000

# ── Collective altitude hold ─────────────────────────────────────────────────
collective.kp                = 0.0600
collective.ki                = 0.0200
collective.kd                = 0.0100
collective.altitude_gain     = 0.5000

# ── Cyclic assist ────────────────────────────────────────────────────────────
# The add-on writes artstab_*_ratio with the stick: total = 1.64 x pitch, 2.13 x roll on the
# ground (see the profile). Expect inner_kp to land lower than the airframe alone would need.
cyclic.outer_kp              = 2.0000
cyclic.outer_ki              = 0.2670
# cyclic.inner_kp, cyclic.inner_kd, cyclic.attitude_limit_deg and cyclic.integral_limit_deg
# are not set: they get swept or flown and then belong to the profile. A value here would
# silently win over a later measurement there.
cyclic.command_rate_deg_s    = 3.0000
cyclic.authority             = 0.3000

# ── Take-off ─────────────────────────────────────────────────────────────────
# The assistant's lift-off ramp (Full) and the height at which the
# collective assist engages. The settle thresholds say when the hover learner
# counts a hover as settled.
sequence.low_hover_m         = 3.0000
sequence.lift_seconds        = 4.0000
sequence.lift_timeout_s      = 30.0000
sequence.settle_climb_ms     = 0.3000
sequence.settle_drift_ms     = 0.5000
sequence.settle_yaw_deg_s    = 3.0000
sequence.rotor_droop_grace_s = 1.0000
