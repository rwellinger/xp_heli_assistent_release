# xp_heli_assistent tuning
# aircraft: Airbus AS350 B (Alpine Studio) — covers B1, B2, B2 VEMD and BA
#
# Flown and measured on 2026-08-27 in still air at 1786 kg and ~900 m density altitude.
# Every measured constant lives in the profile, not here — see src/aircraft/aircraft_profile.cpp:
#
#   collective.hover_collective  0.558   90 s hover, sd 0.0002
#   cyclic.inner_kp              0.085   two sweeps; onset 0.145, full recovery 0.110
#   cyclic.hover_trim_long/lat   2.106 / 3.534   at that gain, and valid only there
#   yaw.torque_per_collective    1.159   sweep, r = +0.971, cross-checked against the hover
#   cyclic.integral_limit_deg    8.0     raised: the generic 5.0 left 1.47 deg of lateral
#   cyclic.attitude_limit_deg   10.0     authority, below the 1.5 where position starts to go
#   sequence.climb_rate_ms       6.0     flown at 3.0 and 5.0; still comfortable at 5.0
#                                        (rotor down 0.18 %, FLI ~84), so 6.0 with margin
#   collective.max_climb_ms      8.0     the ceiling, raised so it never clips the above
#
# The gains below are still R22 starting figures and F2 to F6 have not been flown.
#
# Unlike the AW109 this add-on steers entirely through X-Plane's standard axes — the
# profile carries no write bindings. Verified on the ground with the rotor at 385 RPM,
# each command held rather than written once:
#
#   pedal -0.6   tail rotor blade  -7.2 deg, yaw rate to -41 deg/s
#   pedal +0.6   tail rotor blade +12.0 deg, yaw rate to +34 deg/s
#   cyclic -0.5  pitch rate -25 deg/s, and the aircraft went light
#   collective 0.25  blade 2.55 deg, torque 2369 Nm against 3665 at the lever's 0.375
#
# Nothing was carried over from the EC130. Same class, same manufacturer, similar mass —
# and that is exactly the reasoning the EC130 itself disproved when it inherited R22
# constants. Which way this rotor turns is not established here.
#
# Three cockpit switches can take an axis away from the assist, all of them the pilot's:
#
#   Collective lock  raises override_prop_pitch and drives the blade angle itself.
#                    With it in, the collective assist is decoupled and nothing says so.
#   Cyclic lock      raises override_joystick_pitch and _roll.
#   SAS / "artificial stability"  writes the acf_AS*_rate datarefs rather than an axis,
#                    so it does not look like a fight over a control. Measure with
#                    alpinestudio/AS350_B1/stab_level at 0, and the AP modes (HDG, NAV,
#                    IAS, ALT, VRT) off with it.
#
# Still open:
#
#   1. Wind. Nothing has been flown in it, so the raised integral limit is untested and
#      the sequence's 10 m of clearance is a still-air figure.
#   2. sequence.lift_margin and rotor_droop_fraction still run generic. The rotor held
#      389.6 of 390.7 RPM through a 9 m/s climb, so droop is unlikely to be this
#      airframe's limit — but the lift phase itself has not been measured.
#   3. B1 and BA are 80 kg lighter and less powerful than the B2 this was measured on.
#      hover_collective is the constant that would show it; one control hover on the BA
#      decides whether these four variants need one profile or three.
# Answered 2026-09-11: rotor_droop_fraction runs generic on purpose. Across 47k frames of
# governed climb on eight airframes the rotor never reached 0.92 of its governed speed, so
# the generic value is measured rather than assumed. governor_redline_rpm is gone with it —
# the sequence measures its reference on the ground each flight, which beats any profile
# figure because it carries density altitude and loading for free.

# ── Yaw damper ───────────────────────────────────────────────────────────────
# R22 starting figures, unflown. yaw.torque_per_collective is absent here because it is
# measured and lives in the profile (+1.159) — writing it here would let this file win
# over the measurement.
yaw.kp                       = 0.0800
yaw.ki                       = 0.0200
yaw.kd                       = 0.0400
yaw.authority                = 1.0000
yaw.integral_limit           = 1.0000
yaw.command_rate_deg_s       = 30.0000
yaw.deadband                 = 0.0500
yaw.max_error_deg            = 30.0000
yaw.coord_kp                 = 0.0200
yaw.coord_ki                 = 0.0040
yaw.max_sideslip_deg         = 20.0000

# ── Collective altitude hold ─────────────────────────────────────────────────
# collective.hover_collective is absent here because it is measured and lives in the
# profile (0.558). It moves with weight and density altitude, so it is a figure for
# 1786 kg at 900 m, not a property of the type.
collective.kp                = 0.0600
collective.ki                = 0.0200
collective.kd                = 0.0100
collective.altitude_gain     = 0.5000
# collective.max_climb_ms                      # measured (8.0), owned by the profile
collective.max_offset        = 0.3500

# ── Cyclic assist ────────────────────────────────────────────────────────────
# Six keys are deliberately absent, all of them measured and owned by the profile:
# inner_kp, inner_kd, hover_trim_long/lat, integral_limit_deg, attitude_limit_deg. Setting any of
# them here would silently win over the measurement.
#
# The trims and inner_kp are a pair and must not be split. The inner loop is pure
# proportional, so it holds a standing attitude error of correction/kp; the trims were
# measured at 0.085 and carry that error inside them. Change the gain and they are wrong
# by the difference — on this airframe 0.19 degrees, which is small only because its droop
# is small.
#
# What the trims buy: the take-me-up of 2026-08-27 was flown before they were entered and
# walked 16.4 m from the pad, close enough to a building to be worth writing down. The
# rule of thumb is 3.3 m per degree of trim, and 4.11 degrees of trim predicted 13.6.
cyclic.outer_kp              = 2.0000
cyclic.outer_ki              = 0.2670
cyclic.command_rate_deg_s    = 3.0000
cyclic.authority             = 0.3000

# ── Take-off ─────────────────────────────────────────────────────────────────
# The assistant's lift-off ramp (Full) and the height at which the
# collective assist engages. The settle thresholds say when the hover learner
# counts a hover as settled.
sequence.low_hover_m         = 3.0000
sequence.lift_seconds        = 4.0000
sequence.lift_timeout_s      = 30.0000
sequence.settle_climb_ms     = 0.3000
sequence.settle_drift_ms     = 0.5000
sequence.settle_yaw_deg_s    = 3.0000
sequence.rotor_droop_grace_s = 1.0000
