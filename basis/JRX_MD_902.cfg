# xp_heli_assistent tuning
# aircraft: JRX MD 902
#
# NOTHING HERE HAS BEEN FLOWN ON THIS AIRFRAME. Every gain below is a generic starting
# value — mostly the R22's — kept because the file has to say something and a measured
# MD 902 number does not exist yet. Treat all of it as unverified and work through F2 to
# F6 in docs/open-items.md.
#
# All three assists can run here, but not through the standard axes. The add-on holds the
# pilot's cyclic and pedals on every frame; the profile reaches them through the copilot
# channel instead, which this add-on never mentions at all. Measured on the ground
# 2026-09-08 and not yet flown.
#
# Two consequences belong here rather than in the profile:
#
# 1. The two channels ADD, as on the Bell. The pilot can overrule the assist, which is the
#    property that has to hold — but a pilot pressing a pedal gets his own input twice,
#    because yaw.* below is written as an absolute pedal position. Measure it before
#    trusting the yaw section. (On the Bell this was verified by holding a copilot command
#    and putting the pilot's stick hard the other way; that test is still owed here.)
#
# 2. Fly with SAS ON. sim/cockpit2/switches/artificial_stability_on drives the add-on's
#    Lua script, not X-Plane's stabiliser (whose constants are zero on this airframe), and
#    SAS OFF doubles pitch and roll sensitivity and injects random +-4 % disturbances.
#    Every gain below assumes the neutral state, which is SAS on.
#
# Values are per aircraft: gains depend on inertia, rotor system and control
# sensitivity, so another helicopter needs its own file.
#
# Edit in flight with the sliders in the Settings window, then run the command
# xp_heli_assistent/tuning/save to write the result back here.
# xp_heli_assistent/tuning/reload re-reads this file without a plugin reload.

# ── Yaw damper ───────────────────────────────────────────────────────────────
# Heading hold with the measured yaw rate as the damping term. The command is the
# whole pedal position, not a correction added to the pilot's foot: reading the axis
# back under an override returns this plugin's own last command, and adding to that
# made the loop integrate itself to the stop.
yaw.kp                       = 0.0800
yaw.ki                       = 0.0200
yaw.kd                       = 0.0400
# Clamp on the absolute command. It has to cover whatever standing pedal this airframe
# needs against main rotor torque. Left at 1.0: the standing pedal grows with power, and a
# limit sized for a hover is what ran the loop into its stop on the R22.
# Which pedal an MD 902 hovers on has NOT been measured here. The sign is predicted:
# _prop/0/_prop_dir is +1 in the .acf, which means LEFT pedal across all seven measured
# airframes. Confirm it with the first settled hover before any regression is trusted.
yaw.authority                = 1.0000
# The integrator carries that standing pedal, so it needs room - but never more than
# the axis itself.
yaw.integral_limit           = 1.0000
# How fast full pedal turns the held heading. The pilot steers the setpoint; letting go
# holds whatever direction the aircraft now points.
yaw.command_rate_deg_s       = 30.0000
yaw.deadband                 = 0.0500
yaw.max_error_deg            = 30.0000
# yaw.torque_per_collective is NOT set here and must not be: it is a measured airframe
# constant, it belongs in the profile, and its sign follows the rotor's direction of turn.
# The EC130 turns the other way from the R22, so a copied slope drives the yaw it exists
# to cancel. Zero — the current state — means no feedforward, which is slower to settle
# and never wrong.
# Coordination. In forward flight the pedals do not turn the aircraft - the cyclic does,
# by rolling - and their job is to keep the fuselage aligned with the airflow. Holding a
# heading there fights the turn: measured 2026-08-22, a 20 deg bank produced 50 deg of
# sideslip because the damper kept pulling the nose back. Above coord_above_ms the loop
# zeroes sideslip instead; below hold_below_ms it holds heading again. Gains are smaller
# than the heading ones because a degree of slip is a stronger call for pedal than a
# degree off course. NOT YET FLOWN.
yaw.coord_kp                 = 0.0200
yaw.coord_ki                 = 0.0040
yaw.max_sideslip_deg         = 20.0000

# ── Collective altitude hold ─────────────────────────────────────────────────
# Outer loop turns height error into a target climb rate, inner loop turns climb rate
# error into an offset around the hover collective.
collective.kp                = 0.0600
collective.ki                = 0.0200
collective.kd                = 0.0100
# Target climb rate per metre of height error, in (m/s)/m.
collective.altitude_gain     = 0.5000
# collective.hover_collective is NOT measured on this airframe and must not be written
# here. It is the constant that grounds a sequence: the altitude hold engages at 0.50 m
# AGL and commands it, so a generic value below the real one is a step DOWN at the worst
# possible moment — the Bell aborted with SEQ abort touched_down twice for exactly that.
# Measure it into the profile, and delete whatever `tuning/save` writes here.
collective.max_climb_ms      = 5.0000
collective.max_offset        = 0.3500
# Metres of height per unit of lever travel: moving the lever changes the held height,
# leaving it parked changes nothing. Position cannot be used here - a collective has no
# resting point, and an axis reading a constant 1.0 was taken for "full climb demanded"
# for a whole flight. NEGATIVE if the axis is configured inverted. Verify the sign in F3
# before trusting it — the plugin detects the axis orientation, this value does not.
# Lever movement below this counts as hands off, in units per second.

# ── Cyclic assist ────────────────────────────────────────────────────────────
# Cascaded: the outer loop turns drift into a target attitude, the inner loop holds
# that attitude. Tune from the inside out - set cyclic.outer_kp to 0, get the inner
# loop holding a commanded attitude, only then raise the outer gains.
#
# These are the flown gains of the FlyWithLua reference hover assist, converted from
# its parallel form (Kp_fwd 0.12, Kd_fwd 0.06, Ki_fwd 0.016 on X-Plane 12). They have
# not been flown in this plugin yet.
cyclic.outer_kp              = 2.0000
cyclic.outer_ki              = 0.2670
# cyclic.inner_kp is unmeasured on this airframe and deliberately absent, so the generic
# 0.060 applies. That default is a Robinson R22 figure, and the four airframes measured
# since tolerate 0.100 to 0.155 — sweep it (section 4a) before anything that depends on it.
# Setting it here would silently win over the measurement when it is made.
# cyclic.inner_kd is not set: it belongs to the profile once flown. A 0.0000 here undid the
# profile's 0.040 on the AS350, the 902X and the B412.
# How far the loop may tilt the aircraft, how much standing lean it may learn, and how
# fast the command may move.
# cyclic.attitude_limit_deg and cyclic.authority are MEASURED on this airframe and live
# in the profile (8.0 and 0.50). They must not be set here: this file is the topmost
# layer, so a copy would win over the measurement. With the generic 0.30 of authority the
# roll axis was pinned against its stop for whole recordings while the aircraft drifted
# right at 3.25 m/s — and it dragged the pitch axis into a limit cycle that looked like a
# gain problem and was not.
# Raised from 3.0 fleet-wide on 2026-08-24, after the R22 and EC130 integrators were
# found sitting at the stop for whole climbs. The AS350 needed 8.0 to survive 19 kt.
# Measured on this airframe at 8.0 and living in the profile: the generic 5.0 pinned
# cyclic_trim_lat against it for an entire gain sweep. Must not be set here.
cyclic.command_rate_deg_s    = 3.0000
# How much cyclic the loop may add on top of the pilot's own input. Still additive,
# unlike yaw and collective - that change comes after the cascade has been flown.
# Measured here at 0.50 — see the note above; the value lives in the profile.

# ── Take-off ─────────────────────────────────────────────────────────────────
# The assistant's lift-off ramp (Full) and the height at which the
# collective assist engages. The settle thresholds say when the hover learner
# counts a hover as settled.
sequence.low_hover_m         = 3.0000
sequence.lift_seconds        = 4.0000
sequence.lift_margin         = 0.1000
sequence.lift_timeout_s      = 30.0000
sequence.settle_climb_ms     = 0.3000
sequence.settle_drift_ms     = 0.5000
sequence.settle_yaw_deg_s    = 3.0000
sequence.rotor_droop_fraction = 0.9200
sequence.rotor_droop_grace_s = 1.0000
