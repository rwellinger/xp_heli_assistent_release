# xp_heli_assistent tuning
# aircraft: VSKYLABS 902X-NTR
#
# NOTHING HERE HAS BEEN FLOWN. Every gain is the generic starting value. Fly the sweep
# and the per-axis flights from docs/adding-an-aircraft.md before trusting any of it.
#
# Probed 2026-10-05 against a running sim, on the skids with the rotor governed at
# 395.7 RPM: all required datarefs read through the standard paths, no add-on script holds
# an override flag. The collective is written as a blade angle on index 0, not through
# prop_ratio_all — the fan is an engine too, see the profile. Two turbines, so manifold
# pressure stays unbound and shows as "n/a". 2948 kg MTOW, blade pitch -1 .. +14 degrees.
#
# ── What is NOT set here, on purpose ─────────────────────────────────────────
# Measured aircraft constants live in profiles/VSKYLABS_902X_NTR.profile so that they
# reach every user rather than only this machine. As of today there are none: the
# aircraft has not been flown with the plugin, and a profile does not invent values.
#
# Not a tuning value, noted so nobody re-derives it: the collective is configured
# reversed on this rig (joy_mapped_axis_value[5] reads 1.0 with the lever down). The
# plugin detects that on its own.
#
# Procedure: docs/adding-an-aircraft.md

# ── Yaw damper ───────────────────────────────────────────────────────────────
# A NOTAR whose anti-torque the add-on computes from the pedal, with the Coanda force on
# the left side only — the authority has a step at centre. Untested here; these are the
# R22's numbers. X-Plane's own yaw damper is forced on by the add-on and works the tail
# fins in forward flight, beside the coordination loop below.
yaw.kp                       = 0.0800
yaw.ki                       = 0.0200
yaw.kd                       = 0.0400
yaw.authority                = 1.0000
yaw.integral_limit           = 1.0000
yaw.command_rate_deg_s       = 30.0000
yaw.deadband                 = 0.0500
yaw.max_error_deg            = 30.0000
yaw.coord_kp                 = 0.0200
yaw.coord_ki                 = 0.0040
yaw.max_sideslip_deg         = 20.0000

# ── Collective altitude hold ─────────────────────────────────────────────────
collective.kp                = 0.0600
collective.ki                = 0.0200
collective.kd                = 0.0100
collective.altitude_gain     = 0.5000
collective.max_climb_ms      = 5.0000
collective.max_offset        = 0.3500

# ── Cyclic assist ────────────────────────────────────────────────────────────
# X-Plane's artificial stability is live on this airframe (acf_ASp_lo_rate 0.005,
# acf_ASh_lo_rate 0.0217) — a second loop under this one. The JRX 902 needed authority
# 0.70 and integral limit 11; that is another program and says nothing here.
cyclic.outer_kp              = 2.0000
cyclic.outer_ki              = 0.2670
# cyclic.inner_kp and cyclic.inner_kd are not set: both were swept and belong to the
# profile. A 0.0000 here would silently have undone the profile's kd 0.040 (2026-10-07).
# cyclic.attitude_limit_deg is set in the profile (the generic 6.0 bound on the first
# flight). Setting it here would silently win over the profile.
# cyclic.integral_limit_deg is set in the profile (the generic 5.0 bound in the first
# take-me-up). Setting it here would silently win over the profile.
cyclic.command_rate_deg_s    = 3.0000
cyclic.authority             = 0.3000

# ── Take-off ─────────────────────────────────────────────────────────────────
# The assistant's lift-off ramp (Full) and the height at which the
# collective assist engages. The settle thresholds say when the hover learner
# counts a hover as settled.
sequence.low_hover_m         = 3.0000
sequence.lift_seconds        = 4.0000
sequence.lift_timeout_s      = 30.0000
sequence.settle_climb_ms     = 0.3000
sequence.settle_drift_ms     = 0.5000
sequence.settle_yaw_deg_s    = 3.0000
sequence.rotor_droop_grace_s = 1.0000
