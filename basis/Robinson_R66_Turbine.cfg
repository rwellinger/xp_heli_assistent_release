# xp_heli_assistent tuning
# aircraft: Robinson R66 Turbine
#
# NOTHING HERE HAS BEEN FLOWN. Every gain is carried over from the R22 as a starting
# point. Fly F2 to F6 from the tuning table in docs/open-items.md, one axis at a time, with the
# abort criteria.
#
# Probed 2026-08-24 against a running sim: all required datarefs present, no custom
# control datarefs, and writing reaches the flight model on both the pedal and the
# collective axis. Turbine, so manifold pressure stays unbound and shows as "n/a".
# Rotor governed at 407 RPM, all-up weight 1133 kg.

# ── What is NOT set here, on purpose ─────────────────────────────────────────
# The measured aircraft constants live in the profile (src/aircraft/), not here, so that
# they reach every user rather than only this machine. Measured 2026-08-24:
#
#   hover collective        0.451    two auto-hover runs, agreeing to 0.001
#   torque per collective  -1.012    collective sweep, r = -0.967 over 4088 frames
#   governor redline           ?     still open - from the POH, not from the needle
#
# It stands on LEFT pedal, so the slope is negative like the R22's and unlike the EC130
# and Cabri. That was read off the aircraft, not inferred from the badge on the nose.
#
# Procedure: docs/adding-an-aircraft.md

# ── Yaw damper ───────────────────────────────────────────────────────────────
# An open tail rotor on a turbine. Untested here; these are the R22's numbers.
yaw.kp                       = 0.0800
yaw.ki                       = 0.0200
yaw.kd                       = 0.0400
yaw.authority                = 1.0000
yaw.integral_limit           = 1.0000
yaw.command_rate_deg_s       = 30.0000
yaw.deadband                 = 0.0500
yaw.max_error_deg            = 30.0000
yaw.coord_kp                 = 0.0200
yaw.coord_ki                 = 0.0040
yaw.max_sideslip_deg         = 20.0000

# ── Collective altitude hold ─────────────────────────────────────────────────
collective.kp                = 0.0600
collective.ki                = 0.0200
collective.kd                = 0.0100
collective.altitude_gain     = 0.5000
collective.max_climb_ms      = 5.0000
collective.max_offset        = 0.3500

# ── Cyclic assist ────────────────────────────────────────────────────────────
# Five-blade rotor and more than twice the R22's mass - expect it to want its own
# gains, but that has to be flown, not assumed.
cyclic.outer_kp              = 2.0000
cyclic.outer_ki              = 0.2670
# cyclic.inner_kp is measured for this airframe and lives in its profile (0.1100,
# found in flight 2026-08-25). Setting it here would silently win over the measurement.
# cyclic.inner_kd is not set: it belongs to the profile once flown. A 0.0000 here undid the
# profile's 0.040 on the AS350, the 902X and the B412.
# cyclic.attitude_limit_deg is not set: sized for the assistant's stop, it lives in the profile.
# Raised from 3.0 on 2026-08-24: at 3.0 the R22 and EC130 integrators sat at the
# stop for the whole climb and left 0.42 m/s of residual drift, which is 21 m over
# a sequence. The R22's measured hover roll alone is -3.52 deg.
cyclic.integral_limit_deg    = 5.0000
cyclic.command_rate_deg_s    = 3.0000
cyclic.authority             = 0.3000

# ── Take-off ─────────────────────────────────────────────────────────────────
# The assistant's lift-off ramp (Full) and the height at which the
# collective assist engages. The settle thresholds say when the hover learner
# counts a hover as settled.
sequence.low_hover_m         = 3.0000
sequence.lift_seconds        = 4.0000
sequence.lift_timeout_s      = 30.0000
sequence.settle_climb_ms     = 0.3000
sequence.settle_drift_ms     = 0.5000
sequence.settle_yaw_deg_s    = 3.0000
sequence.rotor_droop_grace_s = 1.0000
