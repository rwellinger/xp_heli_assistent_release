# xp_heli_assistent tuning
# aircraft: Airbus EC130 B4
#
# NOTHING HERE HAS BEEN FLOWN. The datarefs are verified and writing reaches the flight
# model (measured 2026-08-22), but every gain below is carried over from the R22 and is
# a starting point, not a setting. Fly F2 to F6 from the tuning table in docs/open-items.md, one
# axis at a time, with the abort criteria.
#
# Edit in flight with the sliders in the Settings window, then run the command
# xp_heli_assistent/tuning/save to write the result back here.

# ── What is NOT set here, on purpose ─────────────────────────────────────────
# The two measured aircraft constants live in the profile (src/aircraft/), not in this
# file, because they belong to the airframe rather than to a tuning session:
#
#   hover collective           0.485
#   torque per collective     +1.435   (pedal = +1.435 * collective - 0.224, r = +0.989)
#
# Positive where the R22 is negative - this rotor turns the other way, so torque yaws the
# nose left and is held with right pedal.
#
# They are listed here commented out so you can see they exist. Uncommenting one makes
# this file override the profile, which is what you want only after measuring it again -
# weight and density altitude move the hover collective, though not the slope.
#
# yaw.torque_per_collective    = +1.4350
# collective.hover_collective  = 0.4850

# ── Yaw damper ───────────────────────────────────────────────────────────────
yaw.kp                       = 0.0800
yaw.ki                       = 0.0200
yaw.kd                       = 0.0400
yaw.authority                = 1.0000
yaw.integral_limit           = 1.0000
yaw.command_rate_deg_s       = 30.0000
yaw.deadband                 = 0.0500
yaw.max_error_deg            = 30.0000
# Coordination in forward flight. The Fenestron behaves differently from an open tail
# rotor - expect these to need their own tuning.
yaw.coord_kp                 = 0.0200
yaw.coord_ki                 = 0.0040
yaw.max_sideslip_deg         = 20.0000

# ── Collective altitude hold ─────────────────────────────────────────────────
# A turbine responds to a collective pull differently from a governed piston engine.
collective.kp                = 0.0600
collective.ki                = 0.0200
collective.kd                = 0.0100
collective.altitude_gain     = 0.5000
collective.max_climb_ms      = 5.0000
collective.max_offset        = 0.3500

# ── Cyclic assist ────────────────────────────────────────────────────────────
# Heavier aircraft, different rotor inertia. Tune from the inside out.
cyclic.outer_kp              = 2.0000
cyclic.outer_ki              = 0.2670
# cyclic.inner_kp is measured for this airframe and lives in its profile (0.1200,
# swept in flight 2026-08-25). Setting it here would silently win over the measurement,
# and the two hover_trim values only mean anything at the gain they were measured at.
# cyclic.inner_kd is not set: it belongs to the profile once flown. A 0.0000 here undid the
# profile's 0.040 on the AS350, the 902X and the B412.
# cyclic.attitude_limit_deg is not set: measured for the assistant's stop, it lives in the profile.
# Raised from 3.0 on 2026-08-24: at 3.0 the R22 and EC130 integrators sat at the
# stop for the whole climb and left 0.42 m/s of residual drift, which is 21 m over
# a sequence. The R22's measured hover roll alone is -3.52 deg.
cyclic.integral_limit_deg    = 5.0000
cyclic.command_rate_deg_s    = 3.0000
cyclic.authority             = 0.3000

# ── Take-off ─────────────────────────────────────────────────────────────────
# The assistant's lift-off ramp (Full) and the height at which the
# collective assist engages. The settle thresholds say when the hover learner
# counts a hover as settled.
sequence.low_hover_m         = 3.0000
sequence.lift_seconds        = 4.0000
sequence.lift_margin         = 0.1000
sequence.lift_timeout_s      = 30.0000
sequence.settle_climb_ms     = 0.3000
sequence.settle_drift_ms     = 0.5000
sequence.settle_yaw_deg_s    = 3.0000
sequence.rotor_droop_fraction = 0.9200
sequence.rotor_droop_grace_s = 1.0000
