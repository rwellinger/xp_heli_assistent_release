# xp_heli_assistent tuning
# aircraft: Leonardo AW139
#
# NOTHING HERE IS MEASURED AND NOTHING HAS BEEN FLOWN. The datarefs are verified and
# writing reaches the flight model (2026-08-25), which is all that is established. Every
# gain below is an R22 figure carried in as a starting point.
#
# That matters more than it used to. cyclic.inner_kp is the clearest case: the generic
# 0.060 is a Robinson R22 measurement, and the three airframes measured since tolerate
# 0.100 to 0.120. At 7135 kg this one is four times the heaviest of them, so the R22
# value is very unlikely to be right here — and being too low is not harmless, it costs
# the position hold its authority against wind.
#
# Work the procedure in docs/adding-an-aircraft.md, in its order: inner gain sweep first,
# then the constants that depend on it.
#
# This airframe carries its own four-axis autopilot with an auto hover. Switch AP1, AP2
# and SAS off before any measurement — two controllers on one axis do not average.

# ── Yaw damper ───────────────────────────────────────────────────────────────
yaw.kp                       = 0.0800
yaw.ki                       = 0.0200
yaw.kd                       = 0.0400
yaw.authority                = 1.0000
yaw.integral_limit           = 1.0000
yaw.command_rate_deg_s       = 30.0000
yaw.deadband                 = 0.0500
yaw.max_error_deg            = 30.0000
# Coordination in forward flight. The Fenestron behaves differently from an open tail
# rotor - expect these to need their own tuning.
yaw.coord_kp                 = 0.0200
yaw.coord_ki                 = 0.0040
yaw.max_sideslip_deg         = 20.0000

# ── Collective altitude hold ─────────────────────────────────────────────────
# A turbine responds to a collective pull differently from a governed piston engine.
collective.kp                = 0.0600
collective.ki                = 0.0200
collective.kd                = 0.0100
collective.altitude_gain     = 0.5000
collective.max_climb_ms      = 5.0000
collective.max_offset        = 0.3500

# ── Cyclic assist ────────────────────────────────────────────────────────────
# Four times the mass of anything else measured here. Tune from the inside out.
cyclic.outer_kp              = 2.0000
cyclic.outer_ki              = 0.2670
# cyclic.inner_kd is not set: it belongs to the profile once flown. A 0.0000 here undid the
# profile's 0.040 on the AS350, the 902X and the B412.
#
# Four keys deliberately absent, all owned by the profile because this airframe cannot
# hover inside the generic values at all — it flies its hover at +5.85 deg nose up:
#
#   cyclic.inner_kp            0.075   lowered from 0.105 for the assistant (2026-10-08)
#   cyclic.integral_limit_deg  8.0     generic 5.0 was pinned 100 % of a still-air hover
#   cyclic.attitude_limit_deg  10.0    generic 6.0 was reached at 5.95 commanded
#   cyclic.authority           0.50    generic 0.30 was pinned about half of a 13 kt hover
#
# Setting any of them here would silently win over the measurement. `cyclic.authority`
# WAS set here, at the generic 0.3000, until 2026-09-12 — and that is exactly the failure
# this paragraph warns about: it would have held the airframe at 0.30 however the profile
# was raised, and the wind run that showed 0.30 to be too small would have been repeated
# with nothing changed.
cyclic.command_rate_deg_s    = 3.0000

# ── Take-off ─────────────────────────────────────────────────────────────────
# The assistant's lift-off ramp (Full) and the height at which the
# collective assist engages. The settle thresholds say when the hover learner
# counts a hover as settled.
sequence.low_hover_m         = 3.0000
sequence.lift_seconds        = 4.0000
sequence.lift_timeout_s      = 30.0000
sequence.settle_climb_ms     = 0.3000
sequence.settle_drift_ms     = 0.5000
sequence.settle_yaw_deg_s    = 3.0000
sequence.rotor_droop_grace_s = 1.0000
