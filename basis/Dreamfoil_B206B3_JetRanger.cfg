# xp_heli_assistent tuning
# aircraft: Dreamfoil B206B3 JetRanger
#
# NOTHING HERE HAS BEEN FLOWN. Every gain is the generic starting value. Fly the sweep
# and the per-axis flights from docs/adding-an-aircraft.md before trusting any of it.
#
# Probed 2026-09-12 against a running sim, on the skids with the rotor governed at
# 394.6 RPM: all required datarefs read through the standard paths, and three of the
# four axes are steered through X-Plane's own. The collective is not — see the profile.
# Single Allison 250-C20J, so manifold pressure stays unbound and shows as "n/a".
# 1451 kg MTOW, blade pitch -1.5 .. +12.4 degrees.
#
# ── What is NOT set here, on purpose ─────────────────────────────────────────
# Measured aircraft constants live in profiles/Dreamfoil_B206B3_JetRanger.profile so
# that they reach every user rather than only this machine. As of today there are none:
# the aircraft has not been flown with the plugin, and a profile does not invent values.
#
# Three predictions are written down in docs/onboarding-b206.md, to be checked rather
# than adjusted afterwards. The most useful outcome is a clear miss on the inner gain.
#
# One thing IS known and is not a tuning value: the collective is configured reversed on
# this rig (joy_mapped_axis_value[5] reads 1.0 with the lever down). The plugin detects
# that on its own; it is noted so nobody re-derives it.
#
# Procedure: docs/adding-an-aircraft.md

# ── Yaw damper ───────────────────────────────────────────────────────────────
# An open tail rotor on a turbine. Untested here; these are the R22's numbers.
yaw.kp                       = 0.0800
yaw.ki                       = 0.0200
yaw.kd                       = 0.0400
yaw.authority                = 1.0000
yaw.integral_limit           = 1.0000
yaw.command_rate_deg_s       = 30.0000
yaw.deadband                 = 0.0500
yaw.max_error_deg            = 30.0000
yaw.coord_kp                 = 0.0200
yaw.coord_ki                 = 0.0040
yaw.max_sideslip_deg         = 20.0000

# ── Collective altitude hold ─────────────────────────────────────────────────
collective.kp                = 0.0600
collective.ki                = 0.0200
collective.kd                = 0.0100
collective.altitude_gain     = 0.5000
collective.max_climb_ms      = 5.0000
collective.max_offset        = 0.3500

# ── Cyclic assist ────────────────────────────────────────────────────────────
# Five-blade rotor and more than twice the R22's mass - expect it to want its own
# gains, but that has to be flown, not assumed.
cyclic.outer_kp              = 2.0000
cyclic.outer_ki              = 0.2670
# cyclic.inner_kp is measured for this airframe and lives in its profile (0.1100,
# found in flight 2026-08-25). Setting it here would silently win over the measurement.
# cyclic.inner_kd is not set: it belongs to the profile once flown. A 0.0000 here undid the
# profile's 0.040 on the AS350, the 902X and the B412.
# cyclic.attitude_limit_deg and cyclic.integral_limit_deg are not set either: the hover trim
# of +4.88 deg left 1.1 deg of the generic 6 for a stop and 0.06 deg of the generic 5 for
# wind, so both are sized in the profile. A copy here would win over it.
cyclic.command_rate_deg_s    = 3.0000
cyclic.authority             = 0.3000

# ── Take-off ─────────────────────────────────────────────────────────────────
# The assistant's lift-off ramp (Full) and the height at which the
# collective assist engages. The settle thresholds say when the hover learner
# counts a hover as settled.
sequence.low_hover_m         = 3.0000
sequence.lift_seconds        = 4.0000
sequence.lift_timeout_s      = 30.0000
sequence.settle_climb_ms     = 0.3000
sequence.settle_drift_ms     = 0.5000
sequence.settle_yaw_deg_s    = 3.0000
sequence.rotor_droop_grace_s = 1.0000
